<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WebCAD3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font:13px/1.4 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pn{position:absolute;background:#17181ce8;backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 10px 40px #0007}
#top{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;max-width:calc(100% - 24px);overflow-x:auto;align-items:center}

.sep{width:1px;height:20px;background:var(--bd);margin:0 4px;flex:none}

.b{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:.15s}
.b:hover{background:var(--el)}.b.on{background:var(--el);border-color:var(--ac);color:var(--ac2)}
.b.p{background:var(--ac);color:#1a1208;font-weight:600}.b.p:hover{background:var(--ac2)}
.o{border:1px solid var(--bd);background:var(--el)}
#L{left:12px;top:70px;width:176px;max-height:calc(100% - 90px);overflow-y:auto;padding:12px}

h4{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu);font-weight:600;margin:14px 0 7px}h4:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:5px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#L .b,#Rp .g .b{background:var(--el);border-color:var(--bd);font-size:12px;padding:6px 4px;width:100%}
#L .b.on{border-color:var(--ac)}
input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 7px;font-family:'JetBrains Mono',monospace;font-size:11px}
input:focus,select:focus{outline:1px solid var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
label{display:block;font-size:11px;color:var(--mu);margin:7px 0 3px}
.row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}.row b{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--ac2);font-size:11px}
.ol{max-height:150px;overflow-y:auto}.ol div{padding:4px 8px;border-radius:7px;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ol div:hover{background:var(--el)}.ol div.s{background:var(--el);color:var(--ac2)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sw i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #0005;transition:.12s}.sw i:hover{transform:scale(1.2)}
input[type=color]{width:100%;height:30px;background:none;border:1px solid var(--bd);border-radius:8px;padding:2px}
#hud{position:absolute;bottom:14px;right:274px;font:11px 'JetBrains Mono',monospace;color:var(--mu);text-align:right;pointer-events:none}
#st{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mu);padding:6px 14px;pointer-events:none}
#hl{width:8px;height:8px;border-radius:50%;background:#555}.ok{background:#6fcf97!important}.bad{background:#eb5757!important}

#cset{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--bd)}#cf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--bd)}

.fig{width:100%;border-radius:8px;display:block;cursor:zoom-in}
#lb{position:absolute;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}

.q{margin:9px 0 3px;font-weight:600;font-size:12px}.qo{display:inline-block;font-size:11px;padding:3px 10px;margin:2px 4px 2px 0;border:1px solid var(--bd);border-radius:20px;cursor:pointer;color:var(--mu)}.qo:hover{border-color:var(--ac);color:var(--tx)}.qo.s{background:var(--ac);color:#1a1208;border-color:var(--ac)}.cu{font-size:11px;color:var(--ac2);margin:2px 0}.lg{margin-top:10px;padding:8px 10px;border:1px dashed var(--bd);border-radius:8px;font-size:11px;color:var(--mu);line-height:1.5}.lg b{color:var(--ac2);font-weight:600}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top" class="pn"><span class="logo">Web<i>CAD</i>3D</span><span class="sep"></span>
<button class="b" data-v="iso">Iso</button><button class="b" data-v="top">Top</button><button class="b" data-v="front">Front</button><span class="sep"></span>

<button class="b" id="tL">Tools</button><button class="b" id="tR">Panel</button><button class="b p" id="stl">Export STL</button></div>
<div id="L" class="pn">
<h4>Tools</h4><div class="g" id="tools"></div>
<h4>Sculpt</h4><div class="g" id="brushes"></div>
<label>Radius <span id="rv">15</span> mm</label><input type="range" id="br" min="2" max="60" value="15">
<label>Strength</label><input type="range" id="bs" min="1" max="100" value="40">
<label>Falloff</label><select id="bf"><option>smooth</option><option>linear</option><option>spherical</option><option>sharp</option></select>

<label><input type="checkbox" id="snap"> Snap to 5 mm</label>
<h4>Add shape</h4><label>Size (mm)</label><input type="number" id="psz" value="40"><label>Segments</label><input type="number" id="psg" value="48" min="8" max="128">
<div class="g" style="margin-top:7px" id="prims"></div></div>
<div id="lb"></div><div id="toast"></div><div id="hud"></div><div id="st" class="pn"><span id="hl"></span><span id="hs">No mesh</span></div>
<div id="chat" class="pn"><div id="ch"><span>AI Builder</span><span>–</span></div><div id="cl"></div><div id="chips"></div>
<div id="cset" style="flex-wrap:wrap"><label style="display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap"><input type="checkbox" id="ask" checked> Ask questions</label><label style="display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap"><input type="checkbox" id="rf" checked> Refine pass</label><label style="display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap"><input type="checkbox" id="bl" checked> Smooth blend</label><select id="gp" style="flex:1 1 120px;min-width:120px"><option value="gemini">Gemini</option><option value="ollama">Ollama (local)</option></select><input id="gk" type="password" placeholder="Paste Gemini API key (starts with AQ. or AIza)" autocomplete="off" spellcheck="false" style="display:none;flex:1 1 100%;order:10"><input id="gx" type="text" placeholder="Optional: Worker URL (keeps your key hidden)" autocomplete="off" spellcheck="false" style="display:none;flex:1 1 100%;order:11"><button id="gt" type="button" style="display:none;order:12">Test key</button><button id="gv" type="button" style="display:none;order:12">Show</button><input id="gu" type="text" placeholder="Ollama address (default http://localhost:11434)" autocomplete="off" spellcheck="false" style="display:none;flex:1 1 100%;order:10"><input id="om" type="text" list="oml" placeholder="Model (e.g. qwen2.5:7b)" autocomplete="off" spellcheck="false" style="display:none;flex:1 1 100%;order:11"><datalist id="oml"></datalist><span id="gs" style="flex:1 1 100%;order:13;font-size:11px;opacity:.9"></span></div>
<div id="cf"><input id="ci" placeholder="Describe what to make…" autocomplete="off"><button class="b o" id="att" title="Attach a reference image">📎</button><input type="file" id="fi" accept="image/*" style="display:none"><button class="b p" id="cs">Send</button></div></div>
<div id="Rp" class="pn">
<h4>Transform</h4><div id="tf"></div><h4>Size W · H · D (mm)</h4><div class="g3" id="dm"></div>
<h4>Color</h4><input type="color" id="col" value="#c8cad6"><div class="sw" id="sw"></div>
<h4>Outliner</h4><div class="ol" id="ol"></div>
<h4>Analysis</h4><div id="an"></div>
<label>Material</label><select id="fil"><option value="1.24">PLA 1.24</option><option value="1.04">ABS 1.04</option><option value="1.27">PETG 1.27</option><option value="1.21">TPU 1.21</option><option value="1.1">Resin 1.10</option></select>
<label>Infill % (weight estimate)</label><input type="number" id="inf" value="20" min="1" max="100">
<label>Overhang angle <span id="av">45</span>°</label><input type="range" id="ang" min="20" max="80" value="45"></div>
<script>
const $=s=>document.querySelector(s),log=t=>{const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(log.t);log.t=setTimeout(()=>e.classList.remove('s'),1800)};
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;R.setPixelRatio(Math.min(devicePixelRatio,2));

(function(){const gp=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.ShadowMaterial({opacity:.4}));gp.rotation.x=-Math.PI/2;gp.position.y=-.05;gp.receiveShadow=true;scene.add(gp)})();
scene.add(new THREE.HemisphereLight(0xffffff,0x4a4a58,1));
const dl=new THREE.DirectionalLight(0xfff2e0,1.2);dl.position.set(80,150,100);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-150,right:150,top:150,bottom:-150,far:600});dl.shadow.camera.updateProjectionMatrix();dl.shadow.bias=-.0004;dl.shadow.normalBias=.4;scene.add(dl);
const dl2=new THREE.DirectionalLight(0x9ab8ff,.8);dl2.position.set(-100,50,-80);scene.add(dl2);const dl3=new THREE.DirectionalLight(0xffffff,.45);dl3.position.set(-80,60,120);scene.add(dl3);
scene.add(new THREE.GridHelper(220,22,0xf4a261,0x45464d));
const shp=new THREE.Mesh(new THREE.PlaneGeometry(220,220).rotateX(-Math.PI/2),new THREE.ShadowMaterial({opacity:.35}));shp.position.y=.05;shp.receiveShadow=true;scene.add(shp);
const mkStd=c=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.05});
const ovU={uCrit:{value:45}};
const ov=new THREE.ShaderMaterial({uniforms:ovU,side:THREE.DoubleSide,vertexShader:'varying vec3 vN;void main(){vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);}',fragmentShader:'uniform float uCrit;varying vec3 vN;void main(){vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;float a=degrees(asin(clamp(dot(n,vec3(0.,-1.,0.)),-1.,1.)));vec3 c=a<uCrit?vec3(.2,.8,.35):(a<uCrit+15.?vec3(.95,.8,.15):vec3(.9,.15,.15));c*=.55+.45*dot(n,normalize(vec3(.4,.8,.5)));gl_FragColor=vec4(c,1.);}'});
let mode='solid',tool='select',sel=null,meshes=[],cnt=0,undo=[],bulk=false,genN=0,lastParts=null,lastMade=[];
const tc=new THREE.TransformControls(cam,cv);scene.add(tc);

const box=new THREE.BoxHelper(new THREE.Mesh(new THREE.BoxGeometry()),0xf4a261);box.visible=false;scene.add(box);
function weld(g){if(g.index)g=g.toNonIndexed();const p=g.attributes.position,m=new Map(),v=[],ix=[];
for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),k=Math.round(x*1e4)+','+Math.round(y*1e4)+','+Math.round(z*1e4);let j=m.get(k);if(j===undefined){j=v.length/3;m.set(k,j);v.push(x,y,z)}ix.push(j)}
const t=[];for(let i=0;i<ix.length;i+=3){const a=ix[i],b=ix[i+1],c=ix[i+2];if(a!=b&&b!=c&&a!=c)t.push(a,b,c)}

function buildAdj(m){const n=m.geometry.attributes.position.count,a=Array.from({length:n},()=>new Set()),ix=m.geometry.index.array;for(let i=0;i<ix.length;i+=3){const A=ix[i],B=ix[i+1],C=ix[i+2];a[A].add(B).add(C);a[B].add(A).add(C);a[C].add(A).add(B)}m.userData.adj=a.map(s=>[...s])}
const P={Cube:s=>new THREE.BoxGeometry(s,s,s,8,8,8),Cylinder:(s,g)=>new THREE.CylinderGeometry(s/2,s/2,s,g,12),Sphere:(s,g)=>new THREE.SphereGeometry(s/2,g,g/2),Cone:(s,g)=>new THREE.CylinderGeometry(0,s/2,s,g,12),Torus:(s,g)=>new THREE.TorusGeometry(s/2,s/6,g/2,g)};

Object.keys(P).forEach(k=>{const b=document.createElement('button');b.className='b';b.textContent=k;b.onclick=()=>{cnt++;addMesh(weld(P[k](+$('#psz').value||40,Math.max(8,+$('#psg').value||48))),k+' '+cnt)};$('#prims').appendChild(b)});
const TOOLS=['select','translate','rotate','scale'],BR=['clay','smooth','grab','flatten','inflate'],sculpt=()=>BR.includes(tool);
function mkT(a,h){a.forEach(t=>{const b=document.createElement('button');b.className='b';b.dataset.t=t;b.textContent=t;b.onclick=()=>setTool(t);$(h).appendChild(b)})}mkT(TOOLS,'#tools');mkT(BR,'#brushes');
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
orbit.mouseButtons={LEFT:sculpt()?-1:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:sculpt()?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN};
if(['translate','rotate','scale'].includes(t)){tc.setMode(t);if(sel)tc.attach(sel)}else tc.detach();log('Tool: '+t)}
function setSel(m){sel=m;if(m&&['translate','rotate','scale'].includes(tool))tc.attach(m);else tc.detach();box.visible=!!m;if(m)box.setFromObject(m);fillTf();ol();if(m)$('#col').value='#'+m.userData.std.color.getHexString()}
function ol(){$('#ol').innerHTML='';meshes.forEach(m=>{const d=document.createElement('div');d.textContent=m.name;if(m===sel)d.className='s';d.onclick=()=>setSel(m);$('#ol').appendChild(d)})}
const gs=m=>{const s=new THREE.Vector3();m.geometry.boundingBox.getSize(s);return s.multiply(m.scale)},tfIn=[],dmIn=[];
['pos','rot','scl'].forEach((k,r)=>{const h=document.createElement('div');h.innerHTML='<label>'+['Position (mm)','Rotation (°)','Scale'][r]+'</label>';const g=document.createElement('div');g.className='g3';
['x','y','z'].forEach(a=>{const i=document.createElement('input');i.type='number';i.step=r==2?.05:1;i.oninput=()=>{if(!sel||i.value==='')return;const v=+i.value;if(r==0)sel.position[a]=v;else if(r==1)sel.rotation[a]=v*Math.PI/180;else sel.scale[a]=v||.01;refresh()};tfIn.push([r,a,i]);g.appendChild(i)});h.appendChild(g);$('#tf').appendChild(h)});
['x','y','z'].forEach(a=>{const i=document.createElement('input');i.type='number';i.min=1;i.oninput=()=>{if(!sel||i.value===''||+i.value<=0)return;const s=new THREE.Vector3();sel.geometry.boundingBox.getSize(s);sel.scale[a]=+i.value/(s[a]||1);refresh()};dmIn.push([a,i]);$('#dm').appendChild(i)});

for(let i=0;i<ix.length;i+=3){a.fromBufferAttribute(p,ix[i]).applyMatrix4(m.matrixWorld);b.fromBufferAttribute(p,ix[i+1]).applyMatrix4(m.matrixWorld);c.fromBufferAttribute(p,ix[i+2]).applyMatrix4(m.matrixWorld);

$('#an').innerHTML=[['Bounding box',meshes.length?s.x.toFixed(0)+' × '+s.y.toFixed(0)+' × '+s.z.toFixed(0)+' mm':'-'],['Volume',r.vol.toFixed(1)+' cm³'],['Surface',r.area.toFixed(1)+' cm²'],['Est. weight',w.toFixed(1)+' g'],['Open edges',r.open]].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');

document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const d={iso:[130,100,170],top:[0,260,.1],front:[0,40,260]}[b.dataset.v];cam.position.set(...d);orbit.target.set(0,20,0);orbit.update()});
$('#ang').oninput=e=>{ovU.uCrit.value=+e.target.value;$('#av').textContent=e.target.value};$('#br').oninput=e=>$('#rv').textContent=e.target.value;

QUALITY RULES:
1. Write the plan first. Recall the real anatomy or the real product's dimensions and proportions, and size parts to match. Name the specific variant.
2. Use 90 to 150 parts for characters and animals, 40 to 80 for products. Build the big masses with correct proportions first, then secondary forms, then fine detail. Never deliver a plain block assembly.
3. Characters and animals: blend overlapping ellipsoids and capsules into smooth forms. Add joint spheres at shoulders, elbows, knees, wrists. Hands get a palm plus 3 or 4 finger capsules and a thumb; feet get toes. Give every animal its species-specific traits so it cannot be mistaken for another (a monkey has long arms, a lighter face mask on a darker head, round side ears, a brow ridge, a small nose and mouth, a pale belly, grasping hands and feet, and a long tail curling up built from 6 to 8 overlapping capsules that shrink toward the tip; a teddy bear has none of that). Eyes are a white sphere, a dark pupil sphere and a tiny highlight sphere. Use 2 to 3 shades per color group for depth.

5. Placement: every part overlaps its neighbors by 1 to 2 mm, the lowest parts sit on the bed (bottom at y=0), nothing floats. With several items, stand each upright on the bed with 25 to 40 mm gaps along x. An item that belongs in a holder (a controller in a stand) must truly rest in the cradle at the right height and angle with contact surfaces touching; calculate the coordinates.

7. Blending: parts of the same color automatically melt into one smooth sculpted surface where they overlap, so build bodies, heads, limbs, ears and tails from overlapping spheres, capsules and frustums in ONE base color, and use other colors only for separate features (face mask, belly, eyes, accessories, base). Overlap neighbors by 20 percent or more so they fuse.
8. Surface quality: round every outer form (prefer sphere, capsule and frustum over box; boxes only for flat panels), blend masses with overlaps, add 2 to 3 tonal shades per color, darker recessed details, and realistic colors.
9. If a reference image is attached, match its subject, proportions, colors and details exactly.
STYLE: unless the user asks for realism, build characters in the polished 3D-animation toy style: head 45 to 55 percent of total height; huge round expressive eyes (white sphere, large dark iris, smaller pupil, one or two tiny white highlight spheres toward the upper side) sitting on the head surface with about a third protruding; a lighter rounded face mask or muzzle; a small nose; a clear expressive mouth (an open smile is a dark red ellipsoid with a pink tongue and a white row of teeth); chubby tapered limbs with rounded hands and feet; inner-ear color; soft cheeks; a tuft of hair; a curled tail from 8 to 10 overlapping capsules. Give it personality: a head tilt, one arm raised, a lean, feet planted. Faces point to +z. Name eyes, pupils and highlights with those words.
